spring.application.name=SoulUp

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soulup_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password= senaisp

spring.jpa.show-sql=true
spring.jpa.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@soulup.local}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.support.email=${SUPPORT_EMAIL:}

# API integration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=505MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads/videos}

# Python (analisador de video com MediaPipe)
# Caminhos relativos partem da pasta onde o Spring Boot e iniciado (raiz do projeto, no IntelliJ/mvn).
soulup.python.executable=${PYTHON_EXECUTABLE:python}
soulup.python.script-path=${PYTHON_SCRIPT_PATH:./ia-python/main.py}
soulup.video.processing-timeout-seconds=${VIDEO_TIMEOUT_SECONDS:120}
soulup.video.upload-dir=${APP_UPLOAD_DIR:./uploads/videos}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
# O modelo 'gemini-pro' foi aposentado; troque aqui (ou via GEMINI_MODEL) se o Google aposentar o atual.
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}

